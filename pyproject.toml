[project]
name = "autoinference"
version = "0.1.0"
description = "A slotted LLM inference engine whose every part is a swappable plugin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "transformers>=4.51",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
bio = ["mcp>=1.2", "rdkit>=2023.9"]
cloud = ["modal>=1.6"]
platform = [
    "fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "boto3>=1.34",
    "pyyaml>=6.0", "jsonschema>=4.20", "httpx>=0.27", "modal>=1.6",
]

[project.scripts]
autoinference = "autoinference.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoinference = ["configs/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_weights: needs a downloaded checkpoint (set AUTOINFERENCE_REAL_MODEL)",
]
